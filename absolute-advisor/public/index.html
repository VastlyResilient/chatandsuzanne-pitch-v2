<html lang="en">

<meta name="theme-color" content="#0a0d12">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
img,svg{display:block}
a{color:inherit;text-decoration:none}

:root{
  --u:min(0.06410256vw,0.12400794vh);
  --vu:0.09920635vh;
  --inset-top:41;--inset-bottom:106;
  --font-text:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:Inter,var(--font-text);

  --brand-x:225;--brand-y:45;--mark:34;--brand-gap:12;--brand-fs:18.49;
  --links-y:50.5;--links-gap:50;--links-fs:21.69;
  --cta-x:1195;--cta-y:42;--cta-w:140;--cta-h:43;--cta-r:12;--cta-fs:15.70;--cta-dy:2;

  --hero-gap:51;
  --h1-y:323;--h1-fs:36.25;--display-ls:0.0018em;
  --nav-ls:-0.0115em;--brand-ls:-0.0154em;--cta-ls:-0.0127em;--body-ls:0.007em;
  --label-ls:normal;--model-ls:normal;--proof-ls:0.0065em;
  --w-regular:400;--w-display-wght:410;--w-medium:500;--w-semibold:600;
  --w-display:var(--w-display-wght);--w-nav:400;--w-brand:500;--w-cta:520;
  --w-body:var(--w-regular);--w-label:var(--w-medium);
  --w-model:var(--w-regular);--w-proof:480;

  --card-x:425;--card-y:413;--card-w:708;--card-h:143;--card-r:26;
  --ph-x:452;--ph-y:446;--ph-fs:9.97;
  --chips-x:444;--chips-y:505;--chip-h:30;--chip-r:9;--chip-fs:9.0;--chip-gap:5.5;
  --son-fs:10.4;--son-top:15.5;--chev-gap:6.2;
  --chev-x:1013.5;--chev-y:522.3;
  --att-x:1043.2;--att-y:515.1;
  --send-x:1084;--send-y:507;--send-d:35;

  --by-y:799;--by-fs:14.01;--logo-y:867;--logo-gap:62;

  --e-primary:cubic-bezier(.16,1,.3,1);
  --e-soft:cubic-bezier(.22,1,.36,1);
}
@supports (height:100dvh){
  :root{--u:min(0.06410256vw,0.12400794dvh);--vu:0.09920635dvh}
}
@media (min-width:1561px){:root{--inset-top:27;--inset-bottom:74}}

html,body{height:100%}
body{
  overflow:hidden;background:#0a0d12;color:#fff;
  font-family:var(--font-text);font-weight:var(--w-regular);
  font-synthesis:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;
}
:focus-visible{outline:2px solid #F8B285;outline-offset:3px;border-radius:4px}

.stage{position:fixed;inset:0;overflow:hidden;background:#0a0d12}
.stage-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.frame{
  position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:calc(var(--inset-top)*var(--vu)) calc(225*var(--u)) calc(var(--inset-bottom)*var(--vu));
}
#menu{position:absolute;opacity:0;pointer-events:none}

/* ---------------------------------------------------------------- nav */
.nav{position:relative;height:calc(43*var(--u));display:flex;align-items:center;justify-content:space-between;flex:none}
.brand{
  display:flex;align-items:center;gap:calc(var(--brand-gap)*var(--u));
  font-family:var(--font-display);font-variation-settings:"opsz" 32;
  font-size:calc(var(--brand-fs)*var(--u));font-weight:var(--w-brand);letter-spacing:var(--brand-ls);
  text-shadow:0 calc(1*var(--u)) calc(10*var(--u)) rgba(0,0,0,.30);
}
.brand .logo{height:calc(46*var(--u));width:auto;flex:none;filter:drop-shadow(0 calc(1*var(--u)) calc(8*var(--u)) rgba(0,0,0,.35))}
.links{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc((var(--links-y) - 41)*var(--u));
  display:flex;gap:calc(var(--links-gap)*var(--u));
}
.links a{
  font-family:var(--font-text);font-size:calc(var(--links-fs)*var(--u));font-weight:var(--w-nav);
  letter-spacing:var(--nav-ls);line-height:1.2;color:#fff;
  text-shadow:0 calc(1*var(--u)) calc(12*var(--u)) rgba(0,0,0,.32);
  transition:opacity .18s ease;
}
.links a:hover{opacity:.72}
.cta{
  width:calc(var(--cta-w)*var(--u));height:calc(var(--cta-h)*var(--u));border-radius:calc(var(--cta-r)*var(--u));
  align-self:flex-start;margin-top:calc((var(--cta-y) - 41)*var(--u));
  display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cta-fs)*var(--u));font-weight:var(--w-cta);letter-spacing:var(--cta-ls);
  background:linear-gradient(180deg,#3d3d3f 0%,#1d1d20 100%);
  box-shadow:inset 0 calc(1*var(--u)) 0 rgba(255,255,255,.10),0 calc(2*var(--u)) calc(14*var(--u)) rgba(0,0,0,.28);
  transition:filter .18s ease;
}
.cta span{transform:translateY(calc(var(--cta-dy)*var(--u)))}
.cta:hover{filter:brightness(1.16)}
.cta:active{transform:translateY(1px)}
.burger,.sheet{display:none}

/* ---------------------------------------------------------------- hero */
.hero{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--hero-gap)*var(--vu));padding-bottom:calc(4*var(--vu));
}
.head{display:flex;flex-direction:column;align-items:center;gap:calc(14*var(--u));text-align:center;flex:none}
.h1{
  font-family:var(--font-display);font-variation-settings:"opsz" 32;
  font-size:calc(var(--h1-fs)*var(--u));font-weight:var(--w-display);line-height:1.10;letter-spacing:var(--display-ls);
  color:#fff;text-shadow:0 calc(2*var(--u)) calc(22*var(--u)) rgba(0,0,0,.30);
}
.affirm{
  max-width:calc(660*var(--u));min-height:2.7em;
  font-size:max(12px,calc(14.5*var(--u)));font-weight:var(--w-regular);line-height:1.35;letter-spacing:var(--body-ls);
  color:rgba(255,255,255,.86);text-shadow:0 1px 12px rgba(0,0,0,.45);text-wrap:balance;
  transition:opacity .9s ease,transform .9s var(--e-soft);
}
.affirm.out{opacity:0;transform:translateY(4px)}

/* ---------------------------------------------------------------- composer */
.card{
  position:relative;flex:none;
  width:calc(var(--card-w)*var(--u));height:calc(var(--card-h)*var(--u));
  border-radius:calc(var(--card-r)*var(--u));margin-right:calc(3*var(--u));
  background:rgba(41,41,43,.955);
  -webkit-backdrop-filter:blur(calc(26*var(--u))) saturate(112%);backdrop-filter:blur(calc(26*var(--u))) saturate(112%);
  box-shadow:inset 0 0 0 1px rgba(214,228,255,.14),0 calc(22*var(--u)) calc(60*var(--u)) rgba(0,0,0,.30);
}
.ph{
  position:absolute;left:calc((var(--ph-x) - var(--card-x))*var(--u));top:calc((var(--ph-y) - var(--card-y))*var(--u));
  right:calc(24*var(--u));height:calc(50*var(--u));
  color:#e6e6e8;font-size:calc(var(--ph-fs)*var(--u));font-weight:var(--w-body);line-height:1.35;letter-spacing:var(--body-ls);
  resize:none;outline:none;overflow-y:auto;scrollbar-width:thin;caret-color:#F49D70;
}
.ph:not(:placeholder-shown){font-size:max(12.5px,calc(11.5*var(--u)))}
.ph::placeholder{color:#8B8C8E;opacity:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph:focus-visible{outline:none}

.tools{
  position:absolute;
  left:calc((var(--chips-x) - var(--card-x))*var(--u));
  top:calc((var(--chips-y) - var(--card-y))*var(--u));
  right:calc((var(--card-x) + var(--card-w) - 1134)*var(--u));
  height:calc(var(--chip-h)*var(--u));
}
.chips{display:flex;align-items:center;gap:calc(var(--chip-gap)*var(--u));height:100%}
.chip{
  width:calc(var(--cw)*var(--u));height:calc(var(--chip-h)*var(--u));padding-left:calc(var(--pl)*var(--u));
  display:flex;align-items:center;gap:calc(var(--ig)*var(--u));flex:none;
  border-radius:calc(var(--chip-r)*var(--u));
  font-size:calc(var(--chip-fs)*var(--u));font-weight:var(--w-label);letter-spacing:var(--label-ls);color:#909093;line-height:1;white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.088) 0%,rgba(255,255,255,.050) 45%,rgba(255,255,255,.038) 100%);
  border:1px solid rgba(255,255,255,.05);
  transition:color .18s ease,background .18s ease;
}
.chip svg{width:calc(var(--iw)*var(--u));height:auto;flex:none}
.chip span{transform:translateY(calc(2*var(--u)))}
.chip:hover{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.07));color:#c8c8cb}

.right{position:absolute;inset:0;pointer-events:none}
.right>*{position:absolute;pointer-events:auto}
.model{
  left:calc((955 - var(--chips-x) - 0.8)*var(--u));top:calc(var(--son-top)*var(--u));
  display:inline-flex;align-items:center;gap:calc(var(--chev-gap)*var(--u));
  font-size:calc(var(--son-fs)*var(--u));font-weight:var(--w-model);letter-spacing:var(--model-ls);color:#98999C;line-height:1;white-space:nowrap;
  transition:color .18s ease;
}
.model svg{width:calc(6.8*var(--u));height:auto}
.model:hover{color:#c8c8cb}
.model[data-on="false"]{color:#76777a}
.attach{
  left:calc((1043.15 - var(--chips-x))*var(--u));top:calc((515.14 - var(--chips-y))*var(--u));
  color:#A9AAAD;transition:color .18s ease;
}
.attach svg{width:calc(19.79*var(--u));height:auto}
.attach:hover{color:#fff}
.send{
  left:calc((var(--send-x) - var(--chips-x))*var(--u));top:calc((var(--send-y) - var(--chips-y))*var(--u));
  width:calc(var(--send-d)*var(--u));height:calc(var(--send-d)*var(--u));border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(163deg,#FBBC94 0%,#F49D70 46%,#E88654 100%);
  box-shadow:0 calc(3*var(--u)) calc(12*var(--u)) rgba(210,110,60,.34);
  transition:filter .18s ease,transform .18s ease;
}
.send svg{width:calc(11.66*var(--u));height:auto}
.send .stop{display:none}
.busy .send .up{display:none}
.busy .send .stop{display:block}
.send:hover{filter:brightness(1.07)}
.send:active{transform:scale(.95)}

.attachments{display:none;flex-wrap:wrap;gap:6px;justify-content:center;width:calc(var(--card-w)*var(--u));margin-bottom:calc(-38*var(--vu))}
.attachments.has{display:flex}
.pill{
  display:inline-flex;align-items:center;gap:6px;max-width:260px;padding:5px 6px 5px 10px;border-radius:999px;
  background:rgba(24,24,27,.78);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:12px;color:#d6d6d9;
}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill button{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.10);font-size:12px;line-height:18px;color:#bbb}
.pill button:hover{background:rgba(255,255,255,.2);color:#fff}

/* ---------------------------------------------------------------- footer */
.proof{flex:none;display:flex;flex-direction:column;align-items:center;gap:calc(52.3*var(--vu))}
.proof p{
  font-family:var(--font-display);font-variation-settings:"opsz" 32;
  font-size:calc(var(--by-fs)*var(--u));font-weight:var(--w-proof);letter-spacing:var(--proof-ls);color:rgba(255,255,255,.95);
  text-shadow:0 calc(1*var(--u)) calc(12*var(--u)) rgba(0,0,0,.35);
}
.logos{display:flex;align-items:center;gap:calc(var(--logo-gap)*var(--u));filter:drop-shadow(0 calc(1*var(--u)) calc(10*var(--u)) rgba(0,0,0,.30))}
.logos span{
  display:block;font-family:var(--font-display);font-variation-settings:"opsz" 32;
  font-size:calc(21*var(--u));font-weight:var(--w-semibold);letter-spacing:-0.035em;color:#fff;line-height:1;white-space:nowrap;
}
.logos span:nth-child(2){font-weight:var(--w-cta);letter-spacing:.08em;text-transform:uppercase;font-size:calc(15*var(--u))}
.logos span:nth-child(3){font-style:italic;font-weight:var(--w-cta);letter-spacing:-0.02em}

/* ---------------------------------------------------------------- conversation */
.thread{
  display:none;width:calc((var(--card-w) + 12)*var(--u));flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(18*var(--u)) calc(6*var(--u)) calc(6*var(--u));scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 calc(22*var(--u)));mask-image:linear-gradient(180deg,transparent 0,#000 calc(22*var(--u)));
}
.chatting .thread{display:flex;flex-direction:column;gap:calc(16*var(--u))}
.chatting .hero{justify-content:flex-end;gap:calc(18*var(--vu));padding-top:calc(26*var(--vu))}
.chatting .h1{font-size:calc(24*var(--u))}
.chatting .head{gap:calc(6*var(--u))}
.chatting .affirm{min-height:0;font-size:max(11.5px,calc(12.5*var(--u)))}
.chatting .proof{display:none}
.chatting{padding-bottom:calc(34*var(--vu))}
.chatting .attachments{margin-bottom:calc(-10*var(--vu))}

.msg{max-width:100%;animation:e-populate .45s var(--e-soft) both}
.msg.user{
  align-self:flex-end;max-width:78%;padding:10px 14px;border-radius:16px 16px 4px 16px;
  background:rgba(41,41,43,.9);box-shadow:inset 0 0 0 1px rgba(214,228,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:max(13.5px,calc(13.5*var(--u)));line-height:1.5;color:#ececee;white-space:pre-wrap;word-wrap:break-word;
}
.msg.user .files{display:block;margin-top:4px;font-size:11.5px;color:#a9aaad}
.msg.bot{
  align-self:stretch;padding:max(14px,calc(18*var(--u))) max(16px,calc(22*var(--u)));border-radius:max(14px,calc(20*var(--u)));
  background:rgba(22,22,25,.80);box-shadow:inset 0 0 0 1px rgba(214,228,255,.10),0 12px 40px rgba(0,0,0,.25);
  backdrop-filter:blur(20px) saturate(112%);-webkit-backdrop-filter:blur(20px) saturate(112%);
  font-size:max(14px,calc(14.5*var(--u)));line-height:1.6;color:#e4e4e7;letter-spacing:.002em;
}
.md>*+*{margin-top:.7em}
.md h1,.md h2,.md h3,.md h4{font-weight:600;line-height:1.3;color:#fff;letter-spacing:-.01em}
.md h1{font-size:1.25em}.md h2{font-size:1.15em}.md h3,.md h4{font-size:1.02em}
.md strong{color:#fff;font-weight:600}
.md em{color:#d8d8dc}
.md ul,.md ol{padding-left:1.25em}
.md li+li{margin-top:.3em}
.md li::marker{color:#F49D70}
.md a{color:#FBBC94;text-decoration:underline;text-decoration-color:rgba(251,188,148,.4);text-underline-offset:2px}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;padding:.1em .35em;border-radius:5px;background:rgba(255,255,255,.08)}
.md pre{padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.35);overflow-x:auto}
.md pre code{padding:0;background:none}
.md blockquote{border-left:2px solid #F49D70;padding-left:12px;color:#cfcfd3}
.md hr{border:0;height:1px;background:rgba(255,255,255,.1)}
.md .tbl{overflow-x:auto;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.md table{width:100%;border-collapse:collapse;font-size:.9em;font-variant-numeric:tabular-nums}
.md th,.md td{padding:7px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}
.md th{font-weight:600;color:#bdbdc2;font-size:.85em;letter-spacing:.02em;background:rgba(255,255,255,.04)}
.md tr:last-child td{border-bottom:0}
.status{display:flex;align-items:center;gap:9px;font-size:max(12.5px,calc(12.5*var(--u)));color:#a9aaad}
.md+.status{margin-top:.8em}
.status i{width:7px;height:7px;border-radius:50%;background:#F49D70;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)}
.sources b{font-size:11.5px;font-weight:500;color:#8b8c8e;margin-right:2px;align-self:center}
.sources a{font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:#c3c3c7;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sources a:hover{background:rgba(255,255,255,.12);color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.opts button{
  padding:8px 13px;border-radius:10px;font-size:max(12.5px,calc(12.5*var(--u)));font-weight:500;color:#e8e8ea;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.09);
  transition:background .18s ease,border-color .18s ease;
}
.opts button:hover{background:linear-gradient(180deg,rgba(251,188,148,.22),rgba(232,134,84,.12));border-color:rgba(251,188,148,.4)}
.err{color:#ffb4a0}

/* ---------------------------------------------------------------- drawer */
.drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;visibility:hidden}
.drawer.open{visibility:visible}
.drawer .scrim{position:absolute;inset:0;background:rgba(5,7,10,.45);opacity:0;transition:opacity .3s ease}
.drawer.open .scrim{opacity:1}
.panel{
  position:relative;width:min(620px,100%);height:100%;display:flex;flex-direction:column;
  background:rgba(22,22,25,.92);box-shadow:inset 1px 0 0 rgba(214,228,255,.10),-20px 0 60px rgba(0,0,0,.35);
  backdrop-filter:blur(24px) saturate(112%);-webkit-backdrop-filter:blur(24px) saturate(112%);
  transform:translateX(24px);opacity:0;transition:transform .38s var(--e-primary),opacity .3s ease;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
.drawer.open .panel{transform:none;opacity:1}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 24px 14px}
.panel h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.panel .sub{font-size:12.5px;color:#8b8c8e;margin-top:3px}
.x{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.07);color:#ccc;font-size:18px;flex:none}
.x:hover{background:rgba(255,255,255,.14);color:#fff}
.panel .body{flex:1;overflow-y:auto;padding:0 24px 24px;scrollbar-width:thin}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tile{padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tile b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:#8b8c8e}
.search{width:100%;height:38px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font-size:13.5px;margin-bottom:10px;outline:none}
.search:focus{box-shadow:inset 0 0 0 1px rgba(251,188,148,.5)}
.vlist{display:flex;flex-direction:column;gap:6px}
.v{
  display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;
  background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);transition:background .15s ease;
}

(() => {

  // ------------------------------------------------------------ entrance teardown

  // ------------------------------------------------------------ greeting + affirmations

    const part = h < 5 ? 'Good evening' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';

  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  let ai = 0;
  affirm.textContent = AFFIRMATIONS[order[0]] || '';
  setInterval(() => {
    affirm.classList.add('out');
    setTimeout(() => {
      ai = (ai + 1) % order.length;
      affirm.textContent = AFFIRMATIONS[order[ai]];

  // ------------------------------------------------------------ api
  let passcode = store.get('aa.key', '');
  const headers = () => ({ 'Content-Type': 'application/json', ...(passcode ? { 'x-app-key': passcode } : {}) });
  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } });
    if (res.status === 401) { showGate(); throw new Error('locked'); }
    return res;
  }
  function showGate() { $('#gate').classList.add('show'); setTimeout(() => $('#gateInput').focus(), 50); }
  $('#gateForm').addEventListener('submit', async (e) => {

    const r = await fetch('/api/unlock', { method: 'POST', headers: headers() });
    if (r.ok) { store.set('aa.key', passcode); $('#gate').classList.remove('show'); }
    else { $('#gateInput').value = ''; $('#gateInput').placeholder = 'Try again'; }
  });
  fetch('/api/health').then((r) => r.json()).then((h) => {
    if (h.locked && !passcode) showGate();
    if (h.locked && passcode) fetch('/api/unlock', { method: 'POST', headers: headers() }).then((r) => { if (!r.ok) showGate(); });
  }).catch(() => {});

  // ------------------------------------------------------------ markdown (escape first, then a safe subset)
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function inline(s) {
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => (codes.push(c), `\u0000${codes.length - 1}\u0000`));
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?'"])/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 48)}</a>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>').replace(/(^|[^_\w])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
  }
  function md(src) {
    const lines = esc(src).split('\n');
    let out = '', i = 0;
    const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
    const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
    while (i < lines.length) {
      const l = lines[i];
      if (/^\s*```/.test(l)) {
        let code = ''; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) code += lines[i++] + '\n';
        i++; out += `<pre><code>${code}</code></pre>`; continue;
      }
      if (isRow(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        const head = cells(l); i += 2;
        let body = '';
        while (i < lines.length && isRow(lines[i])) body += `<tr>${cells(lines[i++]).map((c) => `<td>${c}</td>`).join('')}</tr>`;
        out += `<div class="tbl"><table><thead><tr>${head.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
        continue;
      }
      let m;
      if ((m = l.match(/^\s*(#{1,4})\s+(.*)$/))) { out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out += '<hr>'; i++; continue; }
      if (/^\s*&gt;\s?/.test(l)) {
        let q = [];
        while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) q.push(lines[i++].replace(/^\s*&gt;\s?/, ''));
        out += `<blockquote>${inline(q.join('<br>'))}</blockquote>`; continue;
      }
      if (/^\s*([-*•])\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l)) {
        const ordered = /^\s*\d+[.)]\s+/.test(l);
        const re = ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*•]\s+/;
        let items = [];
        while (i < lines.length && (re.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
          if (re.test(lines[i])) items.push(lines[i].replace(re, ''));
          else items[items.length - 1] += ' ' + lines[i].trim();
          i++;
        }
        const tag = ordered ? 'ol' : 'ul';
        out += `<${tag}>${items.map((t) => `<li>${inline(t)}</li>`).join('')}</${tag}>`; continue;
      }
      if (!l.trim()) { i++; continue; }
      let p = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(#{1,4}\s|```|[-*•]\s|\d+[.)]\s|&gt;)/.test(lines[i]) && !isRow(lines[i])) p.push(lines[i++]);
      if (!p.length) p.push(lines[i++]);
      out += `<p>${inline(p.join('<br>'))}</p>`;
    }
    return out;
  }
  const OPTS_RE = /\[\[options:\s*([^\]]*)\]\]\s*$/;
  const visible = (t) => t.replace(OPTS_RE, '').replace(/\[\[[^\]]*\]?$/, '').replace(/\[$/, '').trimEnd();

  // ------------------------------------------------------------ conversation state
  // history: [{role:'user'|'assistant', text, files?:[names], sources?:[]}]
  let history = [];
  const saved = store.get('aa.thread', null);
  if (saved && Date.now() - saved.at < 8 * 3600e3 && saved.history?.length) history = saved.history;
  const persist = () => store.set('aa.thread', { at: Date.now(), history });

  function setChatting(on) { frame.classList.toggle('chatting', on); }
  const scrollDown = () => { thread.scrollTop = thread.scrollHeight; };

  function renderUser(h) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.textContent = h.text;
    if (h.files?.length) {
      const f = document.createElement('span'); f.className = 'files';
      f.textContent = 'Attached: ' + h.files.join(', ');
      el.appendChild(f);
    }
    thread.appendChild(el);
  }
  function renderBot(h) {
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML = `<div class="md"></div>`;
    thread.appendChild(el);
    fillBot(el, h.text, h.sources, true);
    return el;
  }
  function fillBot(el, text, sources, final) {
    el.querySelector('.md').innerHTML = md(visible(text));
    el.querySelectorAll('.sources,.opts').forEach((n) => n.remove());
    if (!final) return;
    if (sources?.length) {
      const s = document.createElement('div'); s.className = 'sources';
      s.innerHTML = '<b>Sources</b>' + sources.map((x) => `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" title="${esc(x.title || x.url)}">${esc((x.title || new URL(x.url).hostname).slice(0, 60))}</a>`).join('');
      el.appendChild(s);
    }
    const m = text.match(OPTS_RE);
    if (m && el === thread.lastElementChild) {
      const o = document.createElement('div'); o.className = 'opts';
      m[1].split('|').map((x) => x.trim()).filter(Boolean).slice(0, 6).forEach((label) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
        b.addEventListener('click', () => ask(label));
        o.appendChild(b);
      });
      el.appendChild(o);
    }
  }
  function renderAll() {
    thread.innerHTML = '';
    history.forEach((h) => (h.role === 'user' ? renderUser(h) : renderBot(h)));
    setChatting(history.length > 0);
    requestAnimationFrame(scrollDown);
  }
  renderAll();

  // ------------------------------------------------------------ attachments
  let files = []; // {name, block}
  const pillBox = $('#attachments');
  function renderPills() {
    pillBox.innerHTML = '';
    files.forEach((f, i) => {
      const p = document.createElement('span'); p.className = 'pill';
      p.innerHTML = `<span></span><button type="button" aria-label="Remove">×</button>`;
      p.firstChild.textContent = f.name;
      p.lastChild.addEventListener('click', () => { files.splice(i, 1); renderPills(); });
      pillBox.appendChild(p);
    });
    pillBox.classList.toggle('has', files.length > 0);
  }
  const readAs = (file, how) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r[how](file); });
  async function imageBlock(file) {
    const url = await readAs(file, 'readAsDataURL');
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.86).split(',')[1] } };
  }
  $('#attach').addEventListener('click', () => $('#file').click());
  $('#file').addEventListener('change', async (e) => {
    for (const file of [...e.target.files].slice(0, 8)) {
      try {
        if (file.type.startsWith('image/')) files.push({ name: file.name, block: await imageBlock(file) });
        else if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
          if (file.size > 20e6) { alert(`${file.name} is over 20 MB.`); continue; }
          const data = (await readAs(file, 'readAsDataURL')).split(',')[1];
          files.push({ name: file.name, block: { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data } } });
        } else {
          const text = await readAs(file, 'readAsText');
          files.push({ name: file.name, block: { type: 'text', text: `Attached file "${file.name}":\n\n${text.slice(0, 150000)}` } });
        }
      } catch { alert(`Couldn't read ${file.name}.`); }
    }
    e.target.value = '';
    renderPills();
    input.focus();
  });

  // ------------------------------------------------------------ live search toggle
  let search = store.get('aa.search', true);
  const modelBtn = $('#model');
  const paintModel = () => { modelBtn.dataset.on = String(search); $('#modelLabel').textContent = search ? 'Live Search' : 'Fleet Only'; modelBtn.title = search ? 'Live web search is on' : 'Answers from your fleet data only'; };
  paintModel();
  modelBtn.addEventListener('click', () => { search = !search; store.set('aa.search', search); paintModel(); });

  // ------------------------------------------------------------ asking
  let controller = null;
  function toApi() {
    return history.map((h) => ({ role: h.role, content: h.role === 'user' && h.files?.length ? `${h.text}\n\n[Attached earlier: ${h.files.join(', ')}]` : h.text }));
  }
  async function ask(text) {
    text = (text || '').trim();
    if (controller) return;
    if (!text && !files.length) { input.focus(); return; }
    if (!text) text = 'Take a look at what I attached and tell me what matters.';
    const sending = files; files = []; renderPills();
    const userTurn = { role: 'user', text, files: sending.map((f) => f.name) };
    const priorForApi = toApi();
    history.push(userTurn);
    input.value = ''; autosize();
    setChatting(true);
    renderUser(userTurn);
    const bot = { role: 'assistant', text: '', sources: [] };
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML = '<div class="md"></div><div class="status"><i></i><span>Thinking…</span></div>';
    thread.appendChild(el);
    scrollDown();

    const content = sending.length ? [...sending.map((f) => f.block), { type: 'text', text }] : text;
    controller = new AbortController();
    card.classList.add('busy');
    $('#send').setAttribute('aria-label', 'Stop');
    let raf = 0;
    const paint = () => { raf = 0; const nearBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 140; fillBot(el, bot.text, null, false); if (nearBottom) scrollDown(); };
    const setStatus = (t) => { const s = el.querySelector('.status'); if (s) s.querySelector('span').textContent = t; };
    try {
      const res = await api('/api/chat', { method: 'POST', body: JSON.stringify({ messages: [...priorForApi, { role: 'user', content }], search }), signal: controller.signal });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Server error ${res.status}`);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
          if (!chunk.startsWith('data: ')) continue;
          const ev = JSON.parse(chunk.slice(6));
          if (ev.type === 'text') { bot.text += ev.text; if (!raf) raf = requestAnimationFrame(paint); setStatus('Writing…'); }
          else if (ev.type === 'status') setStatus(ev.text);
          else if (ev.type === 'sources') ev.items.forEach((s) => { if (!bot.sources.some((x) => x.url === s.url)) bot.sources.push(s); });
          else if (ev.type === 'changed') { if (drawerKind === ev.what) openDrawer(ev.what); }
          else if (ev.type === 'error') bot.text += (bot.text ? '\n\n' : '') + `**Heads up:** ${ev.text}`;
        }
      }
    } catch (err) {
      if (err.name !== 'AbortError' && err.message !== 'locked') bot.text += (bot.text ? '\n\n' : '') + `**Heads up:** ${err.message === 'Failed to fetch' ? "I can't reach the Advisor server. Make sure it's running, then try again." : err.message}`;
    } finally {
      if (raf) cancelAnimationFrame(raf);
      controller = null;
      card.classList.remove('busy');
      $('#send').setAttribute('aria-label', 'Ask');
      el.querySelector('.status')?.remove();
      if (!bot.text.trim()) bot.text = '_Stopped._';
      bot.sources = bot.sources.slice(0, 8);
      history.push(bot);
      fillBot(el, bot.text, bot.sources, true);
      persist();
      scrollDown();
    }
  }

  function autosize() {
    if (getComputedStyle(input).position === 'absolute') return;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); }
  });
  $('#send').addEventListener('click', (e) => {
    e.preventDefault();
    if (controller) controller.abort(); else ask(input.value);
  });
  const shortPh = () => { input.placeholder = innerWidth < 600 ? 'Ask me anything about the fleet…' : 'Should I swap an Aviator for a new XTS? Ask me anything about the fleet...'; };
  shortPh(); addEventListener('resize', shortPh);

  // ------------------------------------------------------------ actions
  const PROMPTS = {
    swap: 'Which vehicles should I swap out first, and what should replace them? Rank them, show the math, and tell me the timing.',
    idle: "Which of my vehicles are underused, and exactly how can I make more money with each of them in the next 30 days?",
    play: "Give me today's highest-probability profit play for Absolute Transportation: something I can start today, based on the season, my fleet and my market.",
    playbook: 'Build me a 90-day playbook to grow Absolute Transportation\'s profit: fleet moves, pricing, and new contracts, ranked by impact and likelihood of success.',
    seasons: "What's coming up in the next 60 days between Boston and New Jersey (events, holidays, peak travel dates), and how should I price and position the fleet for each? Use live search.",
  };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    e.preventDefault();
    const act = t.dataset.act;
    $('#menu').checked = false;
    if (PROMPTS[act]) return ask(PROMPTS[act]);
    if (act === 'fleet' || act === 'notes') return openDrawer(act);
    if (act === 'new' || act === 'home') {
      if (controller) controller.abort();
      if (act === 'new' || history.length) { history = []; store.del('aa.thread'); renderAll(); }
      input.focus();
    }
  });

  // ------------------------------------------------------------ drawer: fleet + notes
  const drawer = $('#drawer');
  let drawerKind = null;
  function closeDrawer() { drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); drawerKind = null; }
  drawer.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeDrawer(); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
  const fmt = (n) => Number(n).toLocaleString('en-US');

  async function openDrawer(kind) {
    drawerKind = kind;
    drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false');
    const body = $('#drawerBody');
    if (kind === 'fleet') {
      $('#drawerTitle').textContent = 'Your fleet';
      $('#drawerSub').textContent = 'Sorted by replacement priority. Tap any vehicle for a verdict.';
      body.innerHTML = '<div class="empty">Loading…</div>';
      try {
        const r = await (await api('/api/fleet')).json();
        const s = r.summary;
        const list = r.vehicles.slice().sort((a, b) => b.replacePriority - a.replacePriority);
        body.innerHTML = `
          <div class="tiles">
            <div class="tile"><b>${s.activeCount}</b><span>active units</span></div>
            <div class="tile"><b>${s.over200k}</b><span>at 200k+ mi</span></div>
            <div class="tile"><b>${fmt(Math.round(s.avgMiles / 1000))}k</b><span>avg miles</span></div>
            <div class="tile"><b>${s.avgAge}</b><span>avg age (yrs)</span></div>
          </div>
          <input class="search" id="fleetSearch" placeholder="Search: Aviator, L01588L, Mach-E, 200k…" aria-label="Search fleet">
          <div class="vlist" id="vlist"></div>
          <p class="empty">Roster from the GPS tracker, updated ${esc(r.updated)}. Tell the Advisor about new mileage, sales or purchases and it keeps this list current.</p>`;
        const vlist = $('#vlist');
        const draw = (q) => {
          q = (q || '').toLowerCase();
          vlist.innerHTML = '';
          list.filter((v) => !q || `${v.nickname} ${v.year} ${v.make} ${v.model} ${v.plate} ${v.segment} ${v.flags.join(' ')} ${v.status}`.toLowerCase().includes(q)).forEach((v) => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'v';
            b.innerHTML = `<span><span class="t"></span><br><span class="m"></span></span><span><span class="mi">${fmt(v.miles)} mi</span><br><span class="m">~${fmt(Math.round(v.milesPerYear / 1000))}k/yr</span></span><span class="bar"><i style="width:${v.replacePriority}%"></i></span><span class="fl"></span>`;
            b.querySelector('.t').textContent = `${v.year} ${v.make} ${v.model}`;
            b.querySelector('.m').textContent = `${v.nickname}${v.plate && !v.nickname.includes(v.plate) ? ' · ' + v.plate : ''} · ${v.segment}${v.status !== 'active' ? ' · ' + v.status.toUpperCase() : ''}${v.role ? ' · ' + v.role : ''}`;
            const fl = b.querySelector('.fl');
            v.flags.forEach((f) => { const em = document.createElement('em'); em.textContent = f; if (/replace|exit|heavy/.test(f)) em.className = 'hot'; fl.appendChild(em); });
            b.addEventListener('click', () => {
              closeDrawer();
              ask(`Give me your verdict on #${v.id}, ${v.nickname} (${v.year} ${v.make} ${v.model}${v.plate ? ', ' + v.plate : ''}, ${fmt(v.miles)} mi): keep, reassign, or sell? What's it worth, and what should replace it?`);
            });
            vlist.appendChild(b);
          });
        };
        draw('');
        $('#fleetSearch').addEventListener('input', (e) => draw(e.target.value));
      } catch (e) { body.innerHTML = `<div class="empty err">Couldn't load the fleet. ${esc(e.message)}</div>`; }
    } else {
      $('#drawerTitle').textContent = 'What I remember';
      $('#drawerSub').textContent = 'Facts I use in every answer. Remove anything that is out of date.';
      body.innerHTML = '<div class="empty">Loading…</div>';
      try {
        const notes = await (await api('/api/notes')).json();
        if (!notes.length) {
          body.innerHTML = `<div class="empty">Nothing saved yet. As we talk, I'll remember what matters: your rates, which cars do which jobs, your key clients and goals. You can also just tell me: “Remember that our airport rate to JFK is $325.”</div>`;
          return;
        }
        body.innerHTML = '';
        notes.slice().reverse().forEach((n) => {
          const row = document.createElement('div'); row.className = 'note';
          row.innerHTML = `<p></p><button class="x" type="button" aria-label="Delete note">×</button>`;
          row.querySelector('p').textContent = n.text;
          const small = document.createElement('small'); small.textContent = `${n.category || 'general'} · ${n.date}`;
          row.querySelector('p').appendChild(small);
          row.querySelector('button').addEventListener('click', async () => {
            await api(`/api/notes/${encodeURIComponent(n.id)}`, { method: 'DELETE' });
            row.remove();
          });
          body.appendChild(row);
        });
      } catch (e) { body.innerHTML = `<div class="empty err">Couldn't load notes. ${esc(e.message)}</div>`; }
    }
  }
})();
</script>
</body>
</html>
