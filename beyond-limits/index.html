<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond Limits Connect</title>
<meta name="description" content="The family records, communication and onboarding system built for Beyond Limits Academics — one family, one code.">
<link rel="icon" href="assets/beyond-limits-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">

  <!-- ░░ RAIL ░░ -->
  <aside class="rail" id="rail">
    <div class="rail__brand">
      <img src="assets/beyond-limits-logo.jpg" alt="Beyond Limits Academics" class="rail__mark">
      <div class="rail__brandtext">
        <strong>Beyond&nbsp;Limits</strong>
        <span>Connect</span>
      </div>
    </div>

    <nav class="rail__nav" id="nav"></nav>

    <div class="rail__foot">
      <div class="migration" id="migrationChip">
        <svg viewBox="0 0 36 36" class="migration__ring" aria-hidden="true">
          <circle cx="18" cy="18" r="15.5"></circle>
          <circle cx="18" cy="18" r="15.5" class="migration__val" id="migrationVal"></circle>
        </svg>
        <div>
          <b id="migrationPct">—</b>
          <span>ParentSquare ready</span>
        </div>
      </div>
      <button class="rail__user" id="railUser">
        <span class="avatar avatar--andy">AS</span>
        <span class="rail__userinfo"><b>Andy Sklover</b><small>Co-founder</small></span>
      </button>
    </div>
  </aside>

  <!-- ░░ MAIN ░░ -->
  <div class="main">
    <header class="topbar">
      <div class="topbar__crumb" id="crumb"></div>
      <button class="cmdk" id="cmdkBtn">
        <svg viewBox="0 0 24 24" class="i"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>Search families, codes, programs…</span>
        <kbd>⌘K</kbd>
      </button>
      <div class="topbar__right">
        <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" class="i"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        </button>
        <button class="iconbtn" id="bellBtn" title="Activity" aria-label="Activity">
          <svg viewBox="0 0 24 24" class="i"><path d="M18 8a6 6 0 10-12 0c0 7-2 9-2 9h16s-2-2-2-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          <i class="dot"></i>
        </button>
        <div class="orgpill">
          <span class="orgpill__dot"></span> Stamford, CT · 2026–27
        </div>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <!-- ░░ DRAWER ░░ -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true"></aside>

  <!-- ░░ COMMAND PALETTE ░░ -->
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search" aria-hidden="true">
    <div class="palette__box">
      <div class="palette__input">
        <svg viewBox="0 0 24 24" class="i"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="paletteInput" aria-label="Search families, codes and screens" placeholder="Jump to a family, a code, a program, a screen…" autocomplete="off">
        <kbd>esc</kbd>
      </div>
      <div class="palette__results" id="paletteResults" role="listbox" aria-label="Results"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
