<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaulted Punks — Awake</title>
<style>
  :root{
    --bg:#0c0c0f; --bg2:#141419; --ink:#f4f1ea; --muted:#9a988f;
    --line:#26262e; --accent:#ff8a2b; --awake:#6fe9ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #1b1b22 0%, transparent 60%),
      radial-gradient(900px 900px at 50% 120%, #17140f 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter','Roboto',system-ui,-apple-system,Segoe UI,sans-serif;
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:32px 16px 40px;gap:6px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  header{text-align:center;max-width:640px;margin-bottom:6px;}
  h1{
    font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:.01em;line-height:1.1;
  }
  h1 .dot{color:var(--accent);}
  .tag{margin-top:12px;font-size:clamp(13px,2.4vw,15.5px);line-height:1.5;color:var(--muted);}
  .tag b{color:var(--ink);font-weight:600;}

  .stage{
    display:flex;align-items:center;justify-content:center;gap:clamp(4px,2vw,26px);
    margin-top:14px;width:100%;
  }
  .nav{
    flex:0 0 auto;width:clamp(40px,7vw,54px);height:clamp(40px,7vw,54px);
    border-radius:50%;border:1px solid var(--line);
    background:linear-gradient(180deg,#1c1c22,#141418);
    color:var(--ink);font-size:clamp(20px,4vw,26px);line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .15s,border-color .2s,background .2s;
    user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .nav:hover{border-color:var(--accent);transform:translateY(-1px);}
  .nav:active{transform:scale(.94);}

  .scene{
    flex:0 0 auto;
    width:clamp(250px,46vw,440px);
    aspect-ratio:1/1;
    perspective:1100px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    position:relative;
  }
  .tilt{width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .28s cubic-bezier(.22,.61,.36,1);}
  .lift{width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1);}
  .idle{width:100%;height:100%;}
  .art{
    position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;
    background:#f7943a;
    box-shadow:0 30px 60px -24px rgba(0,0,0,.75), 0 2px 0 rgba(255,255,255,.04) inset;
    transition:box-shadow .4s;
  }
  .art img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    user-select:none;-webkit-user-drag:none;
    filter:drop-shadow(0 0 0 transparent);
    transition:filter .4s;
  }
  /* awake glow aura */
  .aura{
    position:absolute;inset:-2%;border-radius:24px;pointer-events:none;
    background:radial-gradient(circle at 55% 46%, rgba(120,235,255,.34), transparent 58%);
    opacity:0;transition:opacity .5s;mix-blend-mode:screen;z-index:3;
  }

  /* pupils */
  .pupil{
    position:absolute;z-index:4;pointer-events:none;
    width:var(--pd,20px);height:var(--pd,20px);
    transform:translate(-50%,-50%);
    opacity:0;transition:opacity .4s ease;
  }
  .pupil > span{
    display:block;width:100%;height:100%;border-radius:38%;
    transform:translate(var(--tx,0px),var(--ty,0px));
    transition:transform .13s ease-out;
    background:
      radial-gradient(circle at 36% 30%, #4a5057 0 10%, #191c20 46%, #0c0d10 100%);
    box-shadow:inset 0 0 3px rgba(0,0,0,.55);
    position:relative;
  }
  .pupil > span::after{
    content:"";position:absolute;top:16%;left:20%;
    width:26%;height:26%;border-radius:50%;
    background:rgba(255,255,255,.9);filter:blur(.3px);
  }
  /* glowing pupils for the shaded punks (eyes behind lenses) */
  .art.glow .pupil > span{
    background:
      radial-gradient(circle at 50% 45%, #f2ffff 0 16%, #8bedff 40%, rgba(120,232,255,.25) 72%, transparent 100%);
    box-shadow:0 0 12px 3px rgba(120,232,255,.75);
    mix-blend-mode:screen;border-radius:44%;
  }
  .art.glow .pupil > span::after{display:none;}

  /* AWAKE state (class on .scene) */
  .scene.awake .lift{transform:translateY(-14px) scale(1.035);}
  .scene.awake .idle{animation:alert 1.9s ease-in-out infinite;}
  .scene.awake .pupil{opacity:1;}
  .scene.awake .aura{opacity:1;animation:auraPulse 2.1s ease-in-out infinite;}
  .scene.awake .art{box-shadow:0 34px 66px -22px rgba(0,0,0,.8),
      0 0 0 1px rgba(120,232,255,.18), 0 0 42px -6px rgba(120,232,255,.35);}
  .scene.awake .art img{filter:drop-shadow(0 0 10px rgba(120,232,255,.15));}

  @keyframes alert{
    0%,100%{transform:translateY(0) scale(1) rotate(0deg);}
    28%{transform:translateY(-4px) scale(1.005) rotate(-.35deg);}
    58%{transform:translateY(-1.5px) scale(1.002) rotate(.35deg);}
    80%{transform:translateY(-3px) scale(1.003) rotate(-.15deg);}
  }
  @keyframes auraPulse{0%,100%{opacity:.55;}50%{opacity:1;}}

  /* wake hint ring */
  .scene::after{
    content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
    box-shadow:0 0 0 0 rgba(255,138,43,0);transition:box-shadow .4s;
  }
  .scene:not(.awake):hover::after{box-shadow:0 0 0 2px rgba(255,138,43,.35);}

  .meta{
    display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap;justify-content:center;
  }
  .name{font-weight:800;font-size:clamp(17px,3.4vw,21px);letter-spacing:.01em;}
  .name small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:.02em;margin-top:3px;}
  .state{
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
    transition:.3s;white-space:nowrap;
  }
  .state.on{color:#06121a;background:var(--awake);border-color:var(--awake);
    box-shadow:0 0 18px -2px rgba(120,232,255,.6);}

  .thumbs{
    display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center;max-width:560px;
  }
  .thumb{
    width:clamp(52px,12vw,66px);aspect-ratio:1/1;border-radius:13px;overflow:hidden;
    border:2px solid transparent;background:#f7943a;cursor:pointer;padding:0;
    transition:transform .15s,border-color .2s,box-shadow .2s;opacity:.72;
    -webkit-tap-highlight-color:transparent;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;}
  .thumb:hover{transform:translateY(-2px);opacity:1;}
  .thumb.active{border-color:var(--accent);opacity:1;box-shadow:0 6px 18px -8px rgba(255,138,43,.8);}

  .foot{margin-top:24px;font-size:12px;color:#5f5d57;text-align:center;line-height:1.6;}
  kbd{font-family:inherit;background:#1b1b21;border:1px solid var(--line);border-radius:6px;
    padding:1px 6px;font-size:11px;color:var(--muted);}

  @media (prefers-reduced-motion: reduce){
    .scene.awake .idle{animation:none;}
    .scene.awake .aura{animation:none;}
    .tilt,.lift{transition:none;}
  }
</style>
</head>
<body>
  <header>
    <h1>Vaulted Punks<span class="dot">.</span></h1>
    <p class="tag"><b>Click a punk to wake it.</b> It springs up, holds an alert stance, and its eyes track your cursor. Click again to send it back to sleep.</p>
  </header>

  <div class="stage">
    <button class="nav" id="prev" aria-label="Previous punk">‹</button>
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Punk — click to wake or sleep">
      <div class="tilt" id="tilt">
        <div class="lift">
          <div class="idle">
            <div class="art" id="art">
              <div class="aura"></div>
              <img id="charImg" alt="Vaulted Punk">
              <div class="pupil" id="pL"><span></span></div>
              <div class="pupil" id="pR"><span></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button class="nav" id="next" aria-label="Next punk">›</button>
  </div>

  <div class="meta">
    <div class="name" id="name">#0000<small id="desc"></small></div>
    <div class="state" id="state">Asleep</div>
  </div>

  <div class="thumbs" id="thumbs"></div>

  <p class="foot">
    <kbd>←</kbd> <kbd>→</kbd> switch punk &nbsp;·&nbsp; <kbd>space</kbd> / click to wake &amp; sleep<br>

  </p>

};

/* Per-character config.
   Eye coordinates are % of the (square) image. pd = pupil diameter %,
   travel = max pupil shift %, glow = eyes are behind lenses (bright pupil). */
const CHARS = [
  {id:"3288", desc:"Wild green hair · shades", eyes:[[47.5,59.3],[62.5,59.0]], pd:2.9, travel:1.7, glow:true},
  {id:"3141", desc:"Beanie · shades · smoke",  eyes:[[46.5,59.1],[63.5,59.1]], pd:2.9, travel:1.7, glow:true},
  {id:"3234", desc:"Blond mohawk · goatee",    eyes:[[48.6,56.1],[62.9,55.8]], pd:2.5, travel:1.6, glow:false},
  {id:"3289", desc:"Slicked back · stubble",   eyes:[[48.4,56.0],[60.9,55.7]], pd:2.5, travel:1.6, glow:false},
  {id:"3295", desc:"Top knot · mustache",      eyes:[[48.5,56.2],[62.9,55.8]], pd:2.5, travel:1.6, glow:false},
  {id:"3217", desc:"Nerd glasses · beard",     eyes:[[50.7,57.8],[65.6,57.4]], pd:3.2, travel:2.5, glow:false}
];

const scene = document.getElementById('scene');
const tilt  = document.getElementById('tilt');
const art   = document.getElementById('art');
const img   = document.getElementById('charImg');
const pL    = document.getElementById('pL');
const pR    = document.getElementById('pR');
const nameEl= document.getElementById('name');
const descEl= document.getElementById('desc');
const stateEl=document.getElementById('state');
const thumbsEl=document.getElementById('thumbs');

let idx = 0;
let travelPx = 6;
const MAX_RY = 8, MAX_RX = 5;   // parallax degrees

function currentAwake(){ return scene.classList.contains('awake'); }

function applyChar(i){
  idx = (i + CHARS.length) % CHARS.length;
  const c = CHARS[idx];
  // reset to sleep on switch for a clean read
  setAwake(false);
  img.src = IMG[c.id];
  img.alt = "Vaulted Punk #"+c.id;
  art.classList.toggle('glow', !!c.glow);
  // place pupils
  [pL,pR].forEach((el,k)=>{
    el.style.left = c.eyes[k][0] + '%';
    el.style.top  = c.eyes[k][1] + '%';
    el.querySelector('span').style.setProperty('--tx','0px');
    el.querySelector('span').style.setProperty('--ty','0px');
  });
  nameEl.firstChild.nodeValue = '#'+c.id;
  descEl.textContent = c.desc;
  layout();
  // active thumb
  [...thumbsEl.children].forEach((t,j)=>t.classList.toggle('active', j===idx));
}

function layout(){
  const w = art.clientWidth || scene.clientWidth;
  const c = CHARS[idx];
  const pd = c.pd/100 * w;
  art.style.setProperty('--pd', pd.toFixed(1)+'px');
  travelPx = c.travel/100 * w;
}

function setAwake(on){
  scene.classList.toggle('awake', on);
  stateEl.textContent = on ? 'Awake' : 'Asleep';
  stateEl.classList.toggle('on', on);
  if(!on){ resetTracking(); }
}
function toggleAwake(){ setAwake(!currentAwake()); }

function resetTracking(){
  tilt.style.transform = 'rotateX(0deg) rotateY(0deg)';
  pL.querySelector('span').style.setProperty('--tx','0px');
  pL.querySelector('span').style.setProperty('--ty','0px');
  pR.querySelector('span').style.setProperty('--tx','0px');
  pR.querySelector('span').style.setProperty('--ty','0px');
}

function track(mx,my){
  if(!currentAwake()) return;
  // parallax head tilt toward cursor
  const r = scene.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const nx = Math.max(-1,Math.min(1,(mx-cx)/(r.width/2)));
  const ny = Math.max(-1,Math.min(1,(my-cy)/(r.height/2)));
  tilt.style.transform = 'rotateX('+(-ny*MAX_RX).toFixed(2)+'deg) rotateY('+(nx*MAX_RY).toFixed(2)+'deg)';
  // pupils toward cursor
  [pL,pR].forEach(el=>{
    const pr = el.getBoundingClientRect();
    const ex = pr.left + pr.width/2, ey = pr.top + pr.height/2;
    let tx = (mx-ex)*0.12, ty = (my-ey)*0.12;
    const d = Math.hypot(tx,ty);
    if(d>travelPx){ const s=travelPx/d; tx*=s; ty*=s; }
    const sp = el.querySelector('span');
    sp.style.setProperty('--tx', tx.toFixed(1)+'px');
    sp.style.setProperty('--ty', ty.toFixed(1)+'px');
  });
}

/* build thumbnails */
CHARS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='thumb';b.type='button';b.title='#'+c.id;
  b.setAttribute('aria-label','Show punk #'+c.id);
  const im=document.createElement('img');im.src=IMG[c.id];im.alt='#'+c.id;
  b.appendChild(im);
  b.addEventListener('click',()=>applyChar(i));
  thumbsEl.appendChild(b);
});

/* interactions */
scene.addEventListener('click', toggleAwake);
scene.addEventListener('keydown', e=>{
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggleAwake(); }
});
document.getElementById('prev').addEventListener('click', ()=>applyChar(idx-1));
document.getElementById('next').addEventListener('click', ()=>applyChar(idx+1));
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'){ applyChar(idx-1); }
  else if(e.key==='ArrowRight'){ applyChar(idx+1); }
  else if(e.key===' ' && e.target===document.body){ e.preventDefault(); toggleAwake(); }
});
window.addEventListener('mousemove', e=>track(e.clientX,e.clientY));
window.addEventListener('mouseleave', resetTracking);
window.addEventListener('resize', layout);

applyChar(0);
</script>
