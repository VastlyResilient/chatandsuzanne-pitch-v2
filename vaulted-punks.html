<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaulted Punks — Awake</title>
<style>
  :root{
    --bg:#0c0c0f; --ink:#f4f1ea; --muted:#9a988f; --line:#26262e;
    --accent:#ff8a2b; --awake:#6fe9ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #1b1b22 0%, transparent 60%),
      radial-gradient(900px 900px at 50% 120%, #17140f 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter','Roboto',system-ui,-apple-system,Segoe UI,sans-serif;
    min-height:100%;display:flex;flex-direction:column;align-items:center;
    padding:32px 16px 40px;gap:6px;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  header{text-align:center;max-width:640px;margin-bottom:6px;}
  h1{font-size:clamp(26px,5vw,40px);font-weight:800;line-height:1.1;}
  h1 .dot{color:var(--accent);}
  .tag{margin-top:12px;font-size:clamp(13px,2.4vw,15.5px);line-height:1.5;color:var(--muted);}
  .tag b{color:var(--ink);font-weight:600;}

  .stage{display:flex;align-items:center;justify-content:center;gap:clamp(4px,2vw,26px);margin-top:14px;width:100%;}
  .nav{
    flex:0 0 auto;width:clamp(40px,7vw,54px);height:clamp(40px,7vw,54px);border-radius:50%;
    border:1px solid var(--line);background:linear-gradient(180deg,#1c1c22,#141418);color:var(--ink);
    font-size:clamp(20px,4vw,26px);line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .15s,border-color .2s;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .nav:hover{border-color:var(--accent);transform:translateY(-1px);}
  .nav:active{transform:scale(.94);}

  .scene{flex:0 0 auto;width:clamp(250px,46vw,440px);aspect-ratio:1/1;perspective:1100px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;position:relative;}
  .tilt{width:100%;height:100%;transform-style:preserve-3d;transition:transform .28s cubic-bezier(.22,.61,.36,1);}
  .lift{width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.34,1.56,.64,1);}
  .idle{width:100%;height:100%;}
  .art{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:#f7943a;
    box-shadow:0 30px 60px -24px rgba(0,0,0,.75), 0 2px 0 rgba(255,255,255,.04) inset;transition:box-shadow .4s;}
  .art img{position:absolute;pointer-events:none;-webkit-user-drag:none;user-select:none;display:block;}
  .base{inset:0;width:100%;height:100%;object-fit:cover;}
  /* real eyes cut from the art — they only shift when awake */
  .eye{transform:translate(-50%,-50%) translate(var(--tx,0px),var(--ty,0px));
    transition:transform .14s cubic-bezier(.22,.61,.36,1);will-change:transform;z-index:2;}

  .aura{position:absolute;inset:-2%;border-radius:24px;pointer-events:none;z-index:1;
    background:radial-gradient(circle at 55% 46%, rgba(255,175,90,.28), transparent 60%);
    opacity:0;transition:opacity .5s;mix-blend-mode:screen;}

  .scene.awake .lift{transform:translateY(-14px) scale(1.035);}
  .scene.awake .idle{animation:alert 1.9s ease-in-out infinite;}
  .scene.awake .aura{opacity:1;animation:auraPulse 2.1s ease-in-out infinite;}
  .scene.awake .art{box-shadow:0 34px 66px -22px rgba(0,0,0,.8),0 0 0 1px rgba(255,160,80,.18),0 0 40px -6px rgba(255,150,70,.32);}

  @keyframes alert{
    0%,100%{transform:translateY(0) scale(1) rotate(0deg);}
    28%{transform:translateY(-4px) scale(1.005) rotate(-.35deg);}
    58%{transform:translateY(-1.5px) scale(1.002) rotate(.35deg);}
    80%{transform:translateY(-3px) scale(1.003) rotate(-.15deg);}
  }
  @keyframes auraPulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  .scene::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
    box-shadow:0 0 0 0 rgba(255,138,43,0);transition:box-shadow .4s;}
  .scene:not(.awake):hover::after{box-shadow:0 0 0 2px rgba(255,138,43,.35);}

  .meta{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap;justify-content:center;}
  .name{font-weight:800;font-size:clamp(17px,3.4vw,21px);}
  .name small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:3px;}
  .state{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);transition:.3s;white-space:nowrap;}
  .state.on{color:#06121a;background:var(--awake);border-color:var(--awake);box-shadow:0 0 18px -2px rgba(120,232,255,.6);}

  .thumbs{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center;max-width:560px;}
  .thumb{width:clamp(52px,12vw,66px);aspect-ratio:1/1;border-radius:13px;overflow:hidden;border:2px solid transparent;
    background:#f7943a;cursor:pointer;padding:0;transition:transform .15s,border-color .2s,box-shadow .2s;opacity:.72;
    -webkit-tap-highlight-color:transparent;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;}
  .thumb:hover{transform:translateY(-2px);opacity:1;}
  .thumb.active{border-color:var(--accent);opacity:1;box-shadow:0 6px 18px -8px rgba(255,138,43,.8);}

  .foot{margin-top:24px;font-size:12px;color:#5f5d57;text-align:center;line-height:1.6;}
  kbd{font-family:inherit;background:#1b1b21;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--muted);}

  @media (prefers-reduced-motion: reduce){
    .scene.awake .idle{animation:none;}
    .scene.awake .aura{animation:none;}
    .tilt,.lift{transition:none;}
  }
</style>
</head>
<body>
  <header>
    <h1>Vaulted Punks<span class="dot">.</span></h1>
    <p class="tag"><b>Click a punk to wake it.</b> It springs up, holds an alert stance, and its own eyes follow your cursor. Click again to send it back to sleep.</p>
  </header>

  <div class="stage">

        </div>

  <div class="meta">

const CHARS = DATA.chars;

const scene=document.getElementById('scene'), tilt=document.getElementById('tilt'),
      art=document.getElementById('art'), baseImg=document.getElementById('baseImg'),
      eL=document.getElementById('eL'), eR=document.getElementById('eR'),
      nameEl=document.getElementById('name'), descEl=document.getElementById('desc'),
      stateEl=document.getElementById('state'), thumbsEl=document.getElementById('thumbs');
const eyeEls=[eL,eR];
let idx=0, travelPx=6;
const MAX_RY=8, MAX_RX=5;

const awake=()=>scene.classList.contains('awake');

function applyChar(i){
  idx=(i+CHARS.length)%CHARS.length;
  const c=CHARS[idx];
  setAwake(false);
  baseImg.src=c.base; baseImg.alt='Vaulted Punk #'+c.id;
  c.eyes.forEach((e,k)=>{
    const el=eyeEls[k];
    el.src=e.src;
    el.style.left=e.cx+'%'; el.style.top=e.cy+'%'; el.style.width=e.w+'%'; el.style.height='auto';
    el.style.setProperty('--tx','0px'); el.style.setProperty('--ty','0px');
  });
  nameEl.firstChild.nodeValue='#'+c.id; descEl.textContent=c.desc;
  layout();
  [...thumbsEl.children].forEach((t,j)=>t.classList.toggle('active',j===idx));
}
function layout(){ travelPx=CHARS[idx].travel/100*(art.clientWidth||scene.clientWidth); }

function setAwake(on){
  scene.classList.toggle('awake',on);
  stateEl.textContent=on?'Awake':'Asleep';
  stateEl.classList.toggle('on',on);
  if(!on) reset();
}
const toggle=()=>setAwake(!awake());
function reset(){
  tilt.style.transform='rotateX(0deg) rotateY(0deg)';
  eyeEls.forEach(el=>{el.style.setProperty('--tx','0px');el.style.setProperty('--ty','0px');});
}
function track(mx,my){
  if(!awake()) return;
  const r=scene.getBoundingClientRect();
  const nx=Math.max(-1,Math.min(1,(mx-(r.left+r.width/2))/(r.width/2)));
  const ny=Math.max(-1,Math.min(1,(my-(r.top+r.height/2))/(r.height/2)));
  tilt.style.transform='rotateX('+(-ny*MAX_RX).toFixed(2)+'deg) rotateY('+(nx*MAX_RY).toFixed(2)+'deg)';
  eyeEls.forEach(el=>{
    const p=el.getBoundingClientRect();
    let tx=(mx-(p.left+p.width/2))*0.10, ty=(my-(p.top+p.height/2))*0.10;
    const d=Math.hypot(tx,ty);
    if(d>travelPx){const s=travelPx/d;tx*=s;ty*=s;}
    el.style.setProperty('--tx',tx.toFixed(1)+'px');
    el.style.setProperty('--ty',ty.toFixed(1)+'px');
  });
}

CHARS.forEach((c,i)=>{
  const b=document.createElement('button');b.className='thumb';b.type='button';b.title='#'+c.id;
  b.setAttribute('aria-label','Show punk #'+c.id);
  const im=document.createElement('img');im.src=c.base;im.alt='#'+c.id;b.appendChild(im);
  b.addEventListener('click',()=>applyChar(i));
  thumbsEl.appendChild(b);
});

scene.addEventListener('click',toggle);
scene.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});
document.getElementById('prev').addEventListener('click',()=>applyChar(idx-1));
document.getElementById('next').addEventListener('click',()=>applyChar(idx+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')applyChar(idx-1);
  else if(e.key==='ArrowRight')applyChar(idx+1);
  else if(e.key===' '&&e.target===document.body){e.preventDefault();toggle();}
});
window.addEventListener('mousemove',e=>track(e.clientX,e.clientY));
window.addEventListener('mouseleave',reset);
window.addEventListener('resize',layout);
applyChar(0);
</script>
